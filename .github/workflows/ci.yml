name: CI

# GitHub-hosted runners are not available to this repository, so the jobs run on self-hosted
# runners registered by the team (Settings > Actions > Runners). Setup: docs/getting-started.md,
# section "Continuous integration".
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    # The machine already has the compiler, CMake and the X11/OpenGL/udev development packages
    # listed in docs/getting-started.md.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Dependency sources stay in the runner's own cache between runs: nothing is downloaded
      # again unless a pinned version changes.
      - name: Use the machine's dependency cache
        run: echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> "$GITHUB_ENV"

      - name: Configure (warnings as errors)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRTYPE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Check the binaries are at the repository root
        run: ls r-type_server r-type_client

  windows:
    name: Windows
    # Runs once a Windows runner is registered and the repository variable WINDOWS_RUNNER is set
    # to "true" (Settings > Secrets and variables > Actions > Variables); skipped otherwise.
    if: vars.WINDOWS_RUNNER == 'true'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Use the machine's dependency cache
        run: |
          "CPM_SOURCE_CACHE=$env:USERPROFILE\.cache\CPM" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

      - name: Check the binaries are at the repository root
        run: |
          if (-not (Test-Path r-type_server.exe) -or -not (Test-Path r-type_client.exe)) {
            exit 1
          }
